name: Validate and audit project

on:
  push:
    branches:
      - main
      - audit-v0.4.3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python, translations and numerical engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate project structure, Python and locales
        run: python scripts/validate_project.py

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run numerical audit tests
        run: python -m unittest discover -s tests -v
