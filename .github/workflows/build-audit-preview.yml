name: Build audited Windows preview

on:
  push:
    branches:
      - audit-v0.4.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    name: Validate and build audited Windows preview
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Validate source
        run: python scripts/validate_project.py

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run numerical audit
        run: python -m unittest discover -s tests -v

      - name: Prepare portable runtime
        id: portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pythonVersion = "3.13.15"
          $pythonSha256 = "d1f04d990aee1253d8569e8e5104e30fa9f5fa830899f14843448872d936a2cf"
          $pythonUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"

          $releaseDir = Join-Path $env:RUNNER_TEMP "Agent_Cripto_TDR"
          $runtimeDir = Join-Path $releaseDir "runtime"
          $sitePackages = Join-Path $runtimeDir "Lib\site-packages"
          $pythonZip = Join-Path $env:RUNNER_TEMP "python-embed-amd64.zip"

          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null

          $items = @(
            "app", "data", "docs", "tests", "VALIDATION.md",
            "requirements.txt", "INICIAR_AGENT.bat", "README.md",
            "CHANGELOG.md", "VERSIO.txt", "SECURITY.md"
          )
          foreach ($item in $items) {
            Copy-Item -Path $item -Destination $releaseDir -Recurse -Force
          }

          Invoke-WebRequest -Uri $pythonUrl -OutFile $pythonZip
          $actualHash = (Get-FileHash $pythonZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $pythonSha256) {
            throw "Python runtime SHA-256 mismatch."
          }

          Expand-Archive -Path $pythonZip -DestinationPath $runtimeDir -Force
          @("python313.zip", ".", "Lib\site-packages", "import site") |
            Set-Content -Path (Join-Path $runtimeDir "python313._pth") -Encoding ASCII

          python -m pip install --disable-pip-version-check --no-warn-script-location --target "$sitePackages" -r requirements.txt
          python -m pip list --path "$sitePackages" --format=freeze |
            Set-Content -Path (Join-Path $releaseDir "DEPENDENCIES_LOCK.txt") -Encoding UTF8

          $embeddedPython = Join-Path $runtimeDir "python.exe"
          & $embeddedPython -c "import streamlit, pandas, numpy, plotly, ccxt; print('Portable audited runtime OK')"
          if ($LASTEXITCODE -ne 0) { throw "Portable runtime import test failed." }

          Push-Location $releaseDir
          & $embeddedPython -m unittest discover -s tests -v
          $auditExit = $LASTEXITCODE
          Pop-Location
          if ($auditExit -ne 0) { throw "Packaged numerical audit failed." }

          "release_dir=$releaseDir" >> $env:GITHUB_OUTPUT

      - name: Create portable ZIP
        id: package
        shell: pwsh
        run: |
          $releaseDir = "${{ steps.portable.outputs.release_dir }}"
          $zip = Join-Path $env:RUNNER_TEMP "Agent_Cripto_TDR_Windows_v0.4.3-preview.zip"
          Compress-Archive -Path $releaseDir -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        id: installer
        shell: pwsh
        run: |
          $env:APP_VERSION = "0.4.3-preview"
          $env:SOURCE_DIR = "${{ steps.portable.outputs.release_dir }}"
          $outputDir = Join-Path $env:RUNNER_TEMP "installer_output"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          $programFiles = [Environment]::GetFolderPath("ProgramFiles")
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $candidates = @(
            (Join-Path $programFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe")
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found." }

          & $iscc "/O$outputDir" "build_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

          $setup = Join-Path $outputDir "Agent_Cripto_TDR_Setup_v0.4.3-preview.exe"
          if (-not (Test-Path $setup)) { throw "Expected installer was not generated." }
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Academic_Crypto_Investment_Simulator_v0.4.3_audited_preview
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.installer.outputs.setup }}
          if-no-files-found: error
